<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qantas PTFS Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}header{background:#fff;border-bottom:4px solid #d71920;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand b{color:#d71920}.pts{background:#111;color:#fff;border-radius:30px;padding:9px 14px;font-weight:800}.headright{display:flex;gap:8px;align-items:center}.navbtn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:#eee;color:#111}.navbtn.active{background:#d71920;color:#fff}main{max-width:1000px;margin:24px auto;padding:0 15px}.hero{background:linear-gradient(125deg,#151515 0 48%,#d71920 48%);color:#fff;padding:30px;border-radius:18px}.hero h1{margin:0 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:20px;margin-top:16px}.route{font-size:25px;font-weight:900}.muted{color:#666;line-height:1.5}.badge{display:inline-block;background:#fee2e2;color:#9b111e;padding:6px 9px;border-radius:20px;font-size:12px;font-weight:800}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer;background:#eee;color:#111}.primary{background:#d71920;color:#fff}.back{margin-left:5px}.classes,.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.choice{border:2px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer}.choice.selected{border-color:#d71920;background:#fff5f5}.choice.disabled{opacity:.35;cursor:not-allowed}input{width:100%;padding:13px;border:1px solid #aaa;border-radius:8px;background:#fff!important;color:#111!important;caret-color:#111!important;font-size:17px;user-select:text!important;-webkit-user-select:text!important}input::placeholder{color:#777!important}.deck{margin:16px 0;padding:15px;background:#f8fafc;border-radius:14px;overflow-x:auto}.deck h3{text-align:center}.seatrow{display:flex;justify-content:center;gap:5px;margin:6px 0;min-width:470px}.aisle{width:20px}.seat{width:39px;height:33px;border:1px solid #999;border-radius:7px;background:#fff;color:#111;font-size:10px;cursor:pointer}.seat.selected{background:#d71920;color:#fff;border-color:#d71920}.seat.taken{background:#999;color:#fff}.zone{font-size:11px;font-weight:900;text-align:center;margin:14px 0 5px;text-transform:uppercase;letter-spacing:.7px}.summary{line-height:1.8}hr{border:0;border-top:1px solid #eee}.success{background:#ecfdf5;border-color:#a7f3d0}.tabs{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.tab{padding:7px 10px;border-radius:20px;background:#e5e7eb;font-size:12px;font-weight:800}.tab.on{background:#111;color:#fff}@media(max-width:600px){.hero h1{font-size:25px}.route{font-size:21px}}
</style></head><body>
<header><div class="brand"><b>QANTAS</b> PTFS</div><div class="headright">
    <button class="navbtn active" id="bookNav" onclick="home()">Book Flight</button>
    <button class="navbtn" id="bookingsNav" onclick="myBookings()">My Bookings</button>
    <button class="navbtn" id="passengersNav" onclick="passengerList()">Booked Passengers</button>
    <div class="pts"><span id="topPoints">500</span> pts</div>
    </div></header>
<main><div class="hero"><h1>Upcoming PTFS Flight</h1><p>Book your cabin, PTFS seat and onboard meal.</p></div><div id="app"></div></main>
<script>
const flight={id:"QF808",from:"Perth",to:"Greater Rockford",aircraft:"A380",time:"6:10 PM AEST"};
let points=Number(localStorage.getItem("qptfs_points")||500), bookings=JSON.parse(localStorage.getItem("qptfs_bookings")||"[]"), state={};
const prices={Economy:50,"Premium Economy":150,Business:300,First:1000};
const meals={
Economy:[["Basic Sandwich","Ham and cheese sandwich."],["Cup Noodles","Hot instant noodles."],["Snack Box","Crackers, biscuit and water."],["Basic Pasta","Tomato pasta."],["No Meal","No meal selected."]],
"Premium Economy":[["Chicken Pasta","Chicken pasta and salad."],["Beef Rice","Beef with rice."],["Vegetarian Pasta","Vegetable tomato pasta."],["Breakfast","Eggs, potato and fruit."],["Cheese Plate","Cheese, crackers and dessert."]],
Business:[["Steak","Grilled steak and potatoes."],["Salmon","Salmon, rice and vegetables."],["Chicken Parmigiana","Chicken parmigiana and salad."],["Truffle Pasta","Mushroom truffle pasta."],["Breakfast","Eggs, pastry and fruit."]],
First:[["Wagyu Steak","Wagyu steak with sides."],["Lobster","Lobster dinner."],["Sushi Platter","Premium sushi selection."],["Duck","Duck with fine-dining sides."],["Chef Menu","Multi-course chef selection."]]};
function save(){localStorage.setItem("qptfs_points",points);localStorage.setItem("qptfs_bookings",JSON.stringify(bookings));topPoints.textContent=points}
function tabs(n){return `<div class="tabs">${["Flight","Cabin","Seat","Meal","Confirm"].map((x,i)=>`<span class="tab ${i<=n?"on":""}">${i+1} ${x}</span>`).join("")}</div>`}
function nav(which){
  document.getElementById("bookNav").classList.toggle("active",which==="book");
  document.getElementById("bookingsNav").classList.toggle("active",which==="bookings");
  document.getElementById("passengersNav").classList.toggle("active",which==="passengers");
}
function passengerList(){
  nav("passengers");
  if(!bookings.length){
    app.innerHTML=`<div class="card"><h2>Booked Passengers</h2><p class="muted">Nobody has booked this flight yet.</p></div>`;
    return;
  }
  let counts={};
  bookings.forEach(b=>counts[b.cabin]=(counts[b.cabin]||0)+1);
  app.innerHTML=`<div class="card">
    <span class="badge">${flight.id}</span>
    <h2>Booked Passengers</h2>
    <p class="route">${flight.from} → ${flight.to}</p>
    <p class="muted">${flight.aircraft} • ${flight.time}<br>${bookings.length} passenger${bookings.length===1?"":"s"} booked</p>
    <p>${Object.entries(counts).map(([c,n])=>`<span class="badge">${c}: ${n}</span>`).join(" ")}</p>
    ${bookings.map((b,i)=>`<div class="card" style="box-shadow:none">
      <b>${i+1}. ${b.name||"Passenger"}</b>
      <div class="summary">
        ${b.cabin} • Seat ${b.seat}<br>
        Meal: ${b.meal}<br>
        Reference: ${b.ref}
      </div>
    </div>`).join("")}
  </div>`;
}
function myBookings(){
  nav("bookings");
  if(!bookings.length){
    app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">You don't have any bookings yet.</p><button class="btn primary" onclick="home()">Book a flight</button></div>`;
    return;
  }
  app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">Bookings saved on this browser.</p>
  ${bookings.map(b=>`<div class="card" style="box-shadow:none">
    <span class="badge">${b.ref}</span>
    <h3 class="route">${flight.from} → ${flight.to}</h3>
    <div class="summary">
      Passenger: <b>${b.name||"Passenger"}</b><br>
      Aircraft: ${flight.aircraft}<br>
      Departure: ${flight.time}<br>
      Cabin: ${b.cabin}<br>
      Seat: ${b.seat}<br>
      Meal: ${b.meal}
    </div>
  </div>`).join("")}</div>`;
}
function home(){nav("book");state={};app.innerHTML=`${tabs(0)}<div class="card"><span class="badge">${flight.id}</span><h2 class="route">${flight.from} → ${flight.to}</h2><p class="muted">${flight.aircraft}<br>${flight.time}</p><button class="btn primary" onclick="cabins()">Book flight</button></div>`}
function cabins(){app.innerHTML=`${tabs(1)}<div class="card"><h2>Choose cabin</h2><div class="classes">${Object.keys(prices).map(c=>`<div class="choice ${points<prices[c]?"disabled":""}" onclick="${points>=prices[c]?`pickCabin('${c}')`:''}"><b>${c}</b><p>${prices[c]} points</p>${c==="Premium Economy"?"<small>A380 only</small>":""}</div>`).join("")}</div><p><button class="btn back" onclick="home()">Back</button></p></div>`}
function pickCabin(c){state.cabin=c;seats()}
function seatRows(){
 // PTFS A380: 82 upper + 90 lower = 172 passenger seats.
 // Roleplay class zones are mapped onto those PTFS seats, not real-world Qantas seat counts.
 let rows=[];
 if(state.cabin==="First"){
   for(let r=1;r<=4;r++) rows.push({deck:"Upper",zone:"First",seats:[r+"A",r+"F",r+"K"]});
 } else if(state.cabin==="Business"){
   for(let r=5;r<=14;r++) rows.push({deck:"Upper",zone:"Business",seats:[r+"A",r+"C","|",r+"H",r+"K"]});
   rows.push({deck:"Upper",zone:"Business",seats:["15A","15C","|","15H","15K"]});
 } else if(state.cabin==="Premium Economy"){
   for(let r=16;r<=20;r++) rows.push({deck:"Upper",zone:"Premium Economy",seats:[r+"A",r+"B","|",r+"E",r+"F","|",r+"J",r+"K"]});
   rows.push({deck:"Upper",zone:"Premium Economy",seats:["21A","21B","|","21E","21F"]});
 } else {
   for(let r=30;r<=38;r++) rows.push({deck:"Lower",zone:"Economy",seats:[r+"A",r+"B",r+"C","|",r+"D",r+"E",r+"F",r+"G","|",r+"H",r+"J",r+"K"]});
 }
 return rows;
}
function seats(){let taken=new Set(bookings.map(b=>b.seat));let rows=seatRows(), lastZone="";let out="";rows.forEach(row=>{if(row.zone!==lastZone){out+=`<div class="zone">${row.deck} deck — ${row.zone}</div>`;lastZone=row.zone}out+=`<div class="seatrow">${row.seats.map(s=>s==="|" ? '<span class="aisle"></span>' : `<button class="seat ${taken.has(s)?"taken":""}" ${taken.has(s)?"disabled":""} onclick="pickSeat('${s}',this)">${s}</button>`).join("")}</div>`});app.innerHTML=`${tabs(2)}<div class="card"><h2>Select your PTFS A380 seat</h2><p class="muted">PTFS A380 capacity: 172 passengers — 82 upper deck and 90 lower deck. Cabin zones below are for this Qantas PTFS roleplay.</p><div class="deck">${out}</div><button class="btn primary" onclick="seatNext()">Continue</button><button class="btn back" onclick="cabins()">Back</button></div>`}
function pickSeat(s,e){state.seat=s;document.querySelectorAll(".seat.selected").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")}
function seatNext(){if(!state.seat)return alert("Choose a seat.");meal()}
function meal(){let list=meals[state.cabin];app.innerHTML=`${tabs(3)}<div class="card"><h2>Choose your meal</h2><div class="meals">${list.map((m,i)=>`<div class="choice" onclick="pickMeal(${i},this)"><b>${m[0]}</b><p class="muted">${m[1]}</p></div>`).join("")}</div><p><button class="btn primary" onclick="mealNext()">Continue</button><button class="btn back" onclick="seats()">Back</button></p></div>`}
function pickMeal(i,e){state.meal=meals[state.cabin][i][0];document.querySelectorAll(".choice.selected").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")}
function mealNext(){if(!state.meal)return alert("Choose a meal.");confirmPage()}
function confirmPage(){app.innerHTML=`${tabs(4)}<div class="card"><h2>Passenger details</h2><label><b>Roblox username</b></label><p><input id="username" type="text" placeholder="Type your Roblox username here" autocomplete="off"></p><div class="summary"><hr><b>${flight.from} → ${flight.to}</b><br>${flight.aircraft} • ${flight.time}<br>${state.cabin} • Seat ${state.seat}<br>Meal: ${state.meal}<br><b>${prices[state.cabin]} points</b></div><p><button class="btn primary" onclick="finish()">Confirm booking</button><button class="btn back" onclick="meal()">Back</button></p></div>`;setTimeout(()=>document.getElementById("username").focus(),50)}
function finish(){let el=document.getElementById("username"),name=el.value.trim();if(!name)return alert("Type your Roblox username.");let cost=prices[state.cabin];if(points<cost)return alert("Not enough points.");let ref="QF"+Math.random().toString(36).slice(2,7).toUpperCase();bookings.push({ref,name,seat:state.seat,cabin:state.cabin,meal:state.meal});points-=cost;save();app.innerHTML=`<div class="card success"><h2>Booking confirmed!</h2><p class="route">${flight.from} → ${flight.to}</p><p>Passenger: <b>${name}</b><br>Reference: <b>${ref}</b><br>${state.cabin} • Seat ${state.seat}<br>${state.meal}<br>Remaining: ${points} points</p><button class="btn primary" onclick="home()">Done</button></div>`}
save();home();
</script></body></html>
