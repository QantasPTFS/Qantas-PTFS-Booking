<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qantas PTFS Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111;font-family:Arial,sans-serif}header{background:#fff;border-bottom:4px solid #d71920;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.brand b{color:#d71920}.pts{background:#111;color:#fff;border-radius:30px;padding:9px 14px;font-weight:800}.headright{display:flex;gap:8px;align-items:center}.navbtn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer;background:#eee;color:#111}.navbtn.active{background:#d71920;color:#fff}main{max-width:1000px;margin:24px auto;padding:0 15px}.hero{background:linear-gradient(125deg,#151515 0 48%,#d71920 48%);color:#fff;padding:30px;border-radius:18px}.hero h1{margin:0 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:20px;margin-top:16px}.route{font-size:25px;font-weight:900}.muted{color:#666;line-height:1.5}.badge{display:inline-block;background:#fee2e2;color:#9b111e;padding:6px 9px;border-radius:20px;font-size:12px;font-weight:800}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer;background:#eee;color:#111}.primary{background:#d71920;color:#fff}.back{margin-left:5px}.classes,.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.choice{border:2px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer}.choice.selected{border-color:#d71920;background:#fff5f5}.choice.disabled{opacity:.35;cursor:not-allowed}input{width:100%;padding:13px;border:1px solid #aaa;border-radius:8px;background:#fff!important;color:#111!important;caret-color:#111!important;font-size:17px;user-select:text!important;-webkit-user-select:text!important}input::placeholder{color:#777!important}.deck{margin:16px 0;padding:15px;background:#f8fafc;border-radius:14px;overflow-x:auto}.deck h3{text-align:center}.seatrow{display:flex;justify-content:center;gap:5px;margin:6px 0;min-width:470px}.aisle{width:20px}.seat{width:39px;height:33px;border:1px solid #999;border-radius:7px;background:#fff;color:#111;font-size:10px;cursor:pointer}.seat.selected{background:#d71920;color:#fff;border-color:#d71920}.seat.taken{background:#999;color:#fff}.zone{font-size:11px;font-weight:900;text-align:center;margin:14px 0 5px;text-transform:uppercase;letter-spacing:.7px}.summary{line-height:1.8}hr{border:0;border-top:1px solid #eee}.success{background:#ecfdf5;border-color:#a7f3d0}.tabs{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.tab{padding:7px 10px;border-radius:20px;background:#e5e7eb;font-size:12px;font-weight:800}.tab.on{background:#111;color:#fff}@media(max-width:600px){.hero h1{font-size:25px}.route{font-size:21px}}
</style></head><body>
<header><div class="brand"><b>QANTAS</b> PTFS</div><div class="headright">
    <button class="navbtn active" id="bookNav" onclick="home()">Book Flight</button>
    <button class="navbtn" id="bookingsNav" onclick="myBookings()">My Bookings</button>
    <button class="navbtn" id="passengersNav" onclick="passengerList()">Booked Passengers</button>
    <button class="navbtn" id="accountNav" onclick="accountPage()">My Points</button>
    <button class="navbtn" id="adminNav" onclick="adminPage()">Admin</button>
    <div class="pts"><span id="topPoints">—</span> pts</div>
    </div></header>
<main><div class="hero"><h1>Upcoming PTFS Flight</h1><p>Book your cabin, PTFS seat and onboard meal.</p></div><div id="app"></div></main>
<script>
const SUPABASE_URL="https://hapdzsgczxsduiurlexe.supabase.co";
const SUPABASE_KEY="sb_publishable_e50rgEbgNoIhLAc8TA30AA_lUcmRuoa";
const SB_HEADERS={"apikey":SUPABASE_KEY,"Content-Type":"application/json"};
async function sharedBookings(){const r=await fetch(SUPABASE_URL+"/rest/v1/bookings?select=*&flight_number=eq."+encodeURIComponent(flight.id)+"&status=eq.Booked&order=created_at.asc",{headers:SB_HEADERS});if(!r.ok)throw new Error(await r.text());return r.json()}
let flight={id:"QF808",from:"Perth",to:"Greater Rockford",aircraft:"A380",time:"6:10 PM AEST"};
let adminToken=null;
async function loadCurrentFlight(){try{const r=await fetch(SUPABASE_URL+"/rest/v1/flights?select=*&status=eq.Open&order=created_at.desc&limit=1",{headers:SB_HEADERS});if(!r.ok)throw new Error(await r.text());const d=await r.json();if(d.length)flight={id:d[0].flight_number,from:d[0].origin,to:d[0].destination,aircraft:d[0].aircraft,time:d[0].departure_time};}catch(e){console.error("Flight load failed",e)}}
let points=null, currentUser=localStorage.getItem("qptfs_username")||"", bookings=JSON.parse(localStorage.getItem("qptfs_bookings")||"[]"), state={};
const prices={Economy:50,"Premium Economy":150,Business:300,First:1000};
const meals={
Economy:[["Basic Sandwich","Ham and cheese sandwich."],["Cup Noodles","Hot instant noodles."],["Snack Box","Crackers, biscuit and water."],["Basic Pasta","Tomato pasta."],["No Meal","No meal selected."]],
"Premium Economy":[["Chicken Pasta","Chicken pasta and salad."],["Beef Rice","Beef with rice."],["Vegetarian Pasta","Vegetable tomato pasta."],["Breakfast","Eggs, potato and fruit."],["Cheese Plate","Cheese, crackers and dessert."]],
Business:[["Steak","Grilled steak and potatoes."],["Salmon","Salmon, rice and vegetables."],["Chicken Parmigiana","Chicken parmigiana and salad."],["Truffle Pasta","Mushroom truffle pasta."],["Breakfast","Eggs, pastry and fruit."]],
First:[["Wagyu Steak","Wagyu steak with sides."],["Lobster","Lobster dinner."],["Sushi Platter","Premium sushi selection."],["Duck","Duck with fine-dining sides."],["Chef Menu","Multi-course chef selection."]]};
function save(){localStorage.setItem("qptfs_bookings",JSON.stringify(bookings));topPoints.textContent=points===null?"—":points}
function tabs(n){return `<div class="tabs">${["Flight","Cabin","Seat","Meal","Confirm"].map((x,i)=>`<span class="tab ${i<=n?"on":""}">${i+1} ${x}</span>`).join("")}</div>`}
function nav(which){
  document.getElementById("bookNav").classList.toggle("active",which==="book");
  document.getElementById("bookingsNav").classList.toggle("active",which==="bookings");
  document.getElementById("passengersNav").classList.toggle("active",which==="passengers");
  document.getElementById("accountNav").classList.toggle("active",which==="account");
  document.getElementById("adminNav").classList.toggle("active",which==="admin");
}

async function fetchBalance(name){
  let r=await fetch(SUPABASE_URL+"/rest/v1/passengers?select=points&username=eq."+encodeURIComponent(name),{headers:SB_HEADERS});
  if(!r.ok)throw new Error(await r.text());
  let data=await r.json();
  return {points:data.length?data[0].points:500,isNew:!data.length};
}
async function setUser(name){
  name=name.trim();
  if(!name){currentUser="";points=null;localStorage.removeItem("qptfs_username");save();return null}
  let result=await fetchBalance(name);
  currentUser=name;points=result.points;localStorage.setItem("qptfs_username",name);save();return result;
}
async function accountPage(){
  nav("account");
  app.innerHTML=`<div class="card"><h2>My Points</h2><p class="muted">Enter your Roblox username to load your shared Qantas PTFS points balance.</p><p><input id="accountUsername" type="text" placeholder="Roblox username" value="${currentUser.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}" autocomplete="off"></p><p><button class="btn primary" onclick="checkAccount()">Check balance</button>${currentUser?'<button class="btn back" onclick="signOut()">Forget username</button>':''}</p><div id="accountResult" class="summary">${currentUser&&points!==null?`Signed in as <b>${currentUser}</b><br>Shared balance: <b>${points} points</b>`:'Points will appear here after you enter your username.'}</div></div>`;
}
async function checkAccount(){
  let name=document.getElementById("accountUsername").value.trim();if(!name)return alert("Type your Roblox username.");
  document.getElementById("accountResult").textContent="Loading shared balance...";
  try{let r=await setUser(name);document.getElementById("accountResult").innerHTML=`Signed in as <b>${currentUser}</b><br>Shared balance: <b>${points} points</b>${r.isNew?'<br><span class="muted">New passenger — your account will be created with 500 points when you make your first booking.</span>':''}`;}catch(e){points=null;save();document.getElementById("accountResult").textContent="Could not load points. Please try again."}
}
function signOut(){currentUser="";points=null;localStorage.removeItem("qptfs_username");save();accountPage()}
async function restoreUser(){if(!currentUser){points=null;save();return}try{let r=await fetchBalance(currentUser);points=r.points;save()}catch(e){points=null;save()}}

async function adminPage(){
 nav("admin");
 if(!adminToken){app.innerHTML=`<div class="card"><h2>Management Login</h2><p class="muted">Authorised Qantas PTFS management only.</p><p><input id="adminEmail" type="email" placeholder="Admin email"></p><p><input id="adminPassword" type="password" placeholder="Password"></p><button class="btn primary" onclick="adminLogin()">Sign in</button></div>`;return}
 await adminDashboard();
}
async function adminLogin(){
 const email=document.getElementById("adminEmail").value.trim(),password=document.getElementById("adminPassword").value;if(!email||!password)return alert("Enter admin email and password.");
 try{const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:SB_HEADERS,body:JSON.stringify({email,password})});if(!r.ok)throw new Error(await r.text());const d=await r.json();adminToken=d.access_token;const chk=await adminRpc("is_admin",{});if(chk!==true){adminToken=null;throw new Error("Not an admin")};await adminDashboard()}catch(e){console.error(e);alert("Admin login failed.")}
}
async function adminRpc(fn,body){const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{...SB_HEADERS,"Authorization":"Bearer "+adminToken},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();try{return JSON.parse(t)}catch{return t}}
async function adminDashboard(){
 nav("admin");let all=[];try{all=await sharedBookings()}catch(e){}
 app.innerHTML=`<div class="card"><h2>Admin Control Centre</h2><span class="badge">CURRENT FLIGHT</span><h3 class="route">${flight.id}: ${flight.from} → ${flight.to}</h3><p class="muted">${flight.aircraft} • ${flight.time}</p><button class="btn" onclick="adminLogout()">Sign out</button></div>
 <div class="card"><h2>Start Next Flight</h2><p><input id="nfNum" placeholder="Flight number e.g. QF809"></p><p><input id="nfFrom" placeholder="Origin" value="Perth"></p><p><input id="nfTo" placeholder="Destination"></p><p><input id="nfAircraft" placeholder="Aircraft e.g. B787-9"></p><p><input id="nfTime" placeholder="Departure time e.g. 7:30 PM AEST"></p><button class="btn primary" onclick="createNextFlight()">Make Current Flight</button></div>
 <div class="card"><h2>Current Flight Passengers</h2>${all.length?all.map(x=>`<div class="card" style="box-shadow:none"><b>${x.username}</b><div class="summary">${x.cabin} • Seat ${x.seat}<br>Reference: ${x.booking_reference}<br>Status: ${x.status||"Booked"}</div>${(x.status||"Booked")==="Booked"?`<p><button class="btn" onclick="refundAdmin('${x.booking_reference}')">Cancel & Refund</button></p>`:""}</div>`).join(""):'<p class="muted">No passengers booked.</p>'}</div>
 <div class="card"><h2>Complete Flight</h2><p class="muted">Awards flight points to all booked passengers and marks this flight completed.</p><button class="btn primary" onclick="completeFlightAdmin()">Complete ${flight.id}</button></div>`;
}
function adminLogout(){adminToken=null;adminPage()}
async function createNextFlight(){const num=nfNum.value.trim(),from=nfFrom.value.trim(),to=nfTo.value.trim(),aircraft=nfAircraft.value.trim(),time=nfTime.value.trim();if(!num||!from||!to||!aircraft||!time)return alert("Fill in every flight field.");if(!confirm(`Make ${num} ${from} → ${to} the new current flight?`))return;try{await adminRpc("admin_create_flight",{p_flight_number:num,p_origin:from,p_destination:to,p_aircraft:aircraft,p_departure_time:time});await loadCurrentFlight();alert("New current flight created.");await adminDashboard()}catch(e){console.error(e);alert("Could not create flight. Check that the flight number is new.")}}
async function refundAdmin(ref){if(!confirm(`Cancel and refund booking ${ref}?`))return;try{await adminRpc("refund_booking",{p_booking_reference:ref});alert("Booking refunded.");await adminDashboard()}catch(e){console.error(e);alert("Refund failed.")}}
async function completeFlightAdmin(){if(!confirm(`Complete ${flight.id}? This will award points to all booked passengers.`))return;try{const n=await adminRpc("admin_complete_flight",{p_flight_number:flight.id});alert(`Flight completed. ${n} booking(s) received rewards.`);await loadCurrentFlight();await adminDashboard()}catch(e){console.error(e);alert("Could not complete flight.")}}

async function passengerList(){
 nav("passengers"); app.innerHTML=`<div class="card"><h2>Booked Passengers</h2><p class="muted">Loading shared passenger list...</p></div>`;
 try{const all=await sharedBookings(); if(!all.length){app.innerHTML=`<div class="card"><h2>Booked Passengers</h2><p class="muted">Nobody has booked this flight yet.</p></div>`;return}
 let counts={};all.forEach(x=>counts[x.cabin]=(counts[x.cabin]||0)+1);
 app.innerHTML=`<div class="card"><span class="badge">${flight.id}</span><h2>Booked Passengers</h2><p class="route">${flight.from} → ${flight.to}</p><p class="muted">${flight.aircraft} • ${flight.time}<br>${all.length} passengers booked</p><p>${Object.entries(counts).map(([c,n])=>`<span class="badge">${c}: ${n}</span>`).join(" ")}</p>${all.map((x,i)=>`<div class="card" style="box-shadow:none"><b>${i+1}. ${x.username}</b><div class="summary">${x.cabin} • Seat ${x.seat}<br>Meal: ${x.meal}<br>Reference: ${x.booking_reference}</div></div>`).join("")}</div>`;
 }catch(e){app.innerHTML=`<div class="card"><h2>Booked Passengers</h2><p class="muted">Could not load shared bookings. Please refresh.</p></div>`}
}
async function myBookings(){
  nav("bookings");
  app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">Loading active bookings...</p></div>`;
  try{
    const live=await sharedBookings();
    const activeRefs=new Set(live.map(x=>x.booking_reference));
    bookings=bookings.filter(b=>activeRefs.has(b.ref));
    localStorage.setItem("qptfs_bookings",JSON.stringify(bookings));
    if(!bookings.length){
      app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">You don't have any active bookings for this flight.</p><button class="btn primary" onclick="home()">Book a flight</button></div>`;
      return;
    }
    app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">Your active bookings for the current flight.</p>
    ${bookings.map(b=>`<div class="card" style="box-shadow:none">
      <span class="badge">${b.ref}</span>
      <h3 class="route">${flight.from} → ${flight.to}</h3>
      <div class="summary">
        Passenger: <b>${b.name||"Passenger"}</b><br>
        Aircraft: ${flight.aircraft}<br>
        Departure: ${flight.time}<br>
        Cabin: ${b.cabin}<br>
        Seat: ${b.seat}<br>
        Meal: ${b.meal}
      </div>
    </div>`).join("")}</div>`;
  }catch(e){
    app.innerHTML=`<div class="card"><h2>My Bookings</h2><p class="muted">Could not load your live bookings. Please refresh.</p></div>`;
  }
}

function home(){nav("book");state={};app.innerHTML=`${tabs(0)}<div class="card"><span class="badge">${flight.id}</span><h2 class="route">${flight.from} → ${flight.to}</h2><p class="muted">${flight.aircraft}<br>${flight.time}</p><button class="btn primary" onclick="cabins()">Book flight</button></div>`}
function cabins(){app.innerHTML=`${tabs(1)}<div class="card"><h2>Choose cabin</h2><div class="classes">${Object.keys(prices).map(c=>`<div class="choice" onclick="pickCabin('${c}')"><b>${c}</b><p>${prices[c]} points</p>${c==="Premium Economy"?"<small>A380 only</small>":""}</div>`).join("")}</div><p><button class="btn back" onclick="home()">Back</button></p></div>`}
function pickCabin(c){state.cabin=c;seats()}
function seatRows(){
 // PTFS A380: 82 upper + 90 lower = 172 passenger seats.
 // Roleplay class zones are mapped onto those PTFS seats, not real-world Qantas seat counts.
 let rows=[];
 if(state.cabin==="First"){
   for(let r=1;r<=4;r++) rows.push({deck:"Upper",zone:"First",seats:[r+"A",r+"F",r+"K"]});
 } else if(state.cabin==="Business"){
   for(let r=5;r<=14;r++) rows.push({deck:"Upper",zone:"Business",seats:[r+"A",r+"C","|",r+"H",r+"K"]});
   rows.push({deck:"Upper",zone:"Business",seats:["15A","15C","|","15H","15K"]});
 } else if(state.cabin==="Premium Economy"){
   for(let r=16;r<=20;r++) rows.push({deck:"Upper",zone:"Premium Economy",seats:[r+"A",r+"B","|",r+"E",r+"F","|",r+"J",r+"K"]});
   rows.push({deck:"Upper",zone:"Premium Economy",seats:["21A","21B","|","21E","21F"]});
 } else {
   for(let r=30;r<=38;r++) rows.push({deck:"Lower",zone:"Economy",seats:[r+"A",r+"B",r+"C","|",r+"D",r+"E",r+"F",r+"G","|",r+"H",r+"J",r+"K"]});
 }
 return rows;
}
async function seats(){
 app.innerHTML=`${tabs(2)}<div class="card"><h2>Select your PTFS A380 seat</h2><p class="muted">Loading live seat availability...</p></div>`;
 let all;try{all=await sharedBookings()}catch(e){alert("Could not load live seats. Please try again.");return cabins()}
 let taken=new Set(all.map(x=>x.seat)),rows=seatRows(),lastZone="",out="";
 rows.forEach(row=>{if(row.zone!==lastZone){out+=`<div class="zone">${row.deck} deck — ${row.zone}</div>`;lastZone=row.zone}out+=`<div class="seatrow">${row.seats.map(s=>s==="|" ? '<span class="aisle"></span>' : `<button class="seat ${taken.has(s)?"taken":""}" ${taken.has(s)?"disabled":""} onclick="pickSeat('${s}',this)">${s}</button>`).join("")}</div>`});
 app.innerHTML=`${tabs(2)}<div class="card"><h2>Select your PTFS A380 seat</h2><p class="muted">Live availability shared across all passengers.</p><div class="deck">${out}</div><button class="btn primary" onclick="seatNext()">Continue</button><button class="btn back" onclick="cabins()">Back</button></div>`;
}
function pickSeat(s,e){state.seat=s;document.querySelectorAll(".seat.selected").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")}
function seatNext(){if(!state.seat)return alert("Choose a seat.");meal()}
function meal(){let list=meals[state.cabin];app.innerHTML=`${tabs(3)}<div class="card"><h2>Choose your meal</h2><div class="meals">${list.map((m,i)=>`<div class="choice" onclick="pickMeal(${i},this)"><b>${m[0]}</b><p class="muted">${m[1]}</p></div>`).join("")}</div><p><button class="btn primary" onclick="mealNext()">Continue</button><button class="btn back" onclick="seats()">Back</button></p></div>`}
function pickMeal(i,e){state.meal=meals[state.cabin][i][0];document.querySelectorAll(".choice.selected").forEach(x=>x.classList.remove("selected"));e.classList.add("selected")}
function mealNext(){if(!state.meal)return alert("Choose a meal.");confirmPage()}
async function loadBalance(){
 let el=document.getElementById("username"),name=el.value.trim();if(!name){document.getElementById("balanceInfo").textContent="Enter your username to check your shared balance.";return}
 try{let r=await setUser(name);document.getElementById("balanceInfo").innerHTML=`Shared balance: <b>${points} points</b>${r.isNew?" (new passenger)":""}`;}catch(e){points=null;save();document.getElementById("balanceInfo").textContent="Could not load points. Please try again."}
}
function confirmPage(){app.innerHTML=`${tabs(4)}<div class="card"><h2>Passenger details</h2><label><b>Roblox username</b></label><p><input id="username" type="text" placeholder="Type your Roblox username here" value="${currentUser}" autocomplete="off" onblur="loadBalance()"></p><p id="balanceInfo" class="muted">${currentUser&&points!==null?`Shared balance: <b>${points} points</b>`:'Enter your username to check your shared balance.'}</p><div class="summary"><hr><b>${flight.from} → ${flight.to}</b><br>${flight.aircraft} • ${flight.time}<br>${state.cabin} • Seat ${state.seat}<br>Meal: ${state.meal}<br><b>${prices[state.cabin]} points</b></div><p><button class="btn primary" onclick="finish()">Confirm booking</button><button class="btn back" onclick="meal()">Back</button></p></div>`;setTimeout(()=>document.getElementById("username").focus(),50)}
async function finish(){
 let el=document.getElementById("username"),name=el.value.trim();if(!name)return alert("Type your Roblox username.");
 await loadBalance();if(currentUser!==name||points===null)return alert("Could not check your shared points. Please try again.");
 let cost=prices[state.cabin];if(points<cost)return alert(`Not enough points. You have ${points}, but ${state.cabin} costs ${cost}.`);
 let ref="QF"+Math.random().toString(36).slice(2,7).toUpperCase();
 let payload={p_username:name,p_booking_reference:ref,p_flight_number:flight.id,p_origin:flight.from,p_destination:flight.to,p_aircraft:flight.aircraft,p_departure_time:flight.time,p_cabin:state.cabin,p_seat:state.seat,p_meal:state.meal};
 try{let r=await fetch(SUPABASE_URL+"/rest/v1/rpc/book_flight",{method:"POST",headers:{...SB_HEADERS,"Prefer":"return=representation"},body:JSON.stringify(payload)});
 if(!r.ok){let msg=await r.text();if(msg.includes("unique_flight_seat")||msg.includes("bookings_flight_number_seat_key")){alert("That seat was just booked. Choose another seat.");return seats()}if(msg.includes("Not enough points")){await loadBalance();return alert("Not enough points for this cabin.")}throw new Error(msg)}
 bookings.push({ref,name,seat:state.seat,cabin:state.cabin,meal:state.meal});localStorage.setItem("qptfs_bookings",JSON.stringify(bookings));points-=cost;currentUser=name;save();
 app.innerHTML=`<div class="card success"><h2>Booking confirmed!</h2><p class="route">${flight.from} → ${flight.to}</p><p>Passenger: <b>${name}</b><br>Reference: <b>${ref}</b><br>${state.cabin} • Seat ${state.seat}<br>${state.meal}<br>Shared balance: <b>${points} points</b></p><button class="btn primary" onclick="home()">Done</button></div>`;
 }catch(e){console.error(e);alert("Booking could not be saved. Please try again.")}
}

async function startSite(){await loadCurrentFlight();save();home();restoreUser()}
startSite();
</script></body></html>
